name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:connection
      - run: npm run lint
      - name: Build hosted frontend
        run: npm run build
        env:
          VITE_API_PROFILE: render-free
          VITE_API_BASE_URL: https://api.optiq.example
      - name: Build full local frontend
        run: npm run build
        env:
          VITE_API_PROFILE: full
          VITE_API_BASE_URL: ''

  backend:
    name: Backend tests with SURF
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      OPTIQ_PROFILE: full
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Restore SURF wheel
        id: surf-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: backend/.cache/surf-wheels/*.whl
          key: surf-ubuntu24-x64-py312-${{ hashFiles('backend/requirements-lock.txt', 'backend/scripts/build_surf.py') }}
      - name: Build SURF wheel
        id: surf_build
        if: steps.surf-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config
          python scripts/build_surf.py --minimal --jobs 2
      - name: Install and verify real SURF
        run: |
          python -m pip install --force-reinstall --no-deps .cache/surf-wheels/*.whl
          python -c "import cv2; cv2.xfeatures2d.SURF_create(400); print('SURF enabled:', cv2.__version__)"
      # Save before tests: an unrelated test failure must not discard this build.
      - name: Save verified SURF wheel
        if: steps.surf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: backend/.cache/surf-wheels/*.whl
          key: ${{ steps.surf-cache.outputs.cache-primary-key }}
      - name: Run backend suite
        run: python -m unittest discover -s tests -v
      - name: Show compiler errors on failure
        if: failure() && steps.surf_build.outcome == 'failure'
        run: |
          if [ -f .cache/surf-wheels/build.log ]; then
            tail -100 .cache/surf-wheels/build.log
          fi
