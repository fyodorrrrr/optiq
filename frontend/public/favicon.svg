<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Match the mascot-filter token in src/index.css; preserve the original pixel art. -->
    <filter id="emerald" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="2.15" />
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.04" />
        <feFuncG type="linear" slope="1.04" />
        <feFuncB type="linear" slope="1.04" />
      </feComponentTransfer>
    </filter>
  </defs>
  <image width="32" height="32" href="data:image/png;base64," filter="url(#emerald)" style="image-rendering:pixelated" />
</svg>
